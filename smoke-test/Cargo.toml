[package]
name = "wosh-smoke-test"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end gate: the composed browser SSH client under wasmtime, over real iroh, through the listener, into a real OpenSSH sshd, authenticated by its own WebCrypto key."

[dependencies]
anyhow = "1"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
wasmtime = { version = "47", features = ["component-model", "component-model-async", "async", "cranelift", "runtime"] }
wasmtime-wasi = { version = "47", features = ["p3"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Carries driver reactor isolation (their #158/#159, found by the
# freeze drill here): a wedged webrtc driver costs a pool thread, not
# the embedding component.
wasmtime-webrtc-datachannels = { git = "https://github.com/polymorph-components/polymorph-webrtc-datachannels", rev = "42f76c988c3356e62abf33af6a04f1daf8f0839c" }
polymorph-webcrypto-wasmtime = { git = "https://github.com/polymorph-components/polymorph-webcrypto", rev = "422796bd4ca8450fc527415b7cc60ea8ab1b36ff" }
wasmtime-websocket = { git = "https://github.com/polymorph-components/polymorph-websocket", rev = "563aa33fc214920e80a2fec6019e91a127969a7a" }

[[bin]]
name = "wosh-smoke-test"
path = "src/main.rs"
