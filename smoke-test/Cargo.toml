[package]
name = "wosh-smoke-test"
version = "0.1.0"
edition = "2021"
publish = false
description = "End-to-end gate: the composed browser SSH client under wasmtime, over real iroh, through the listener, into a real OpenSSH sshd, authenticated by its own WebCrypto key."

[dependencies]
anyhow = "1"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
wasmtime = { version = "47", features = ["component-model", "component-model-async", "async", "cranelift", "runtime"] }
wasmtime-wasi = { version = "47", features = ["p3"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Carries driver reactor isolation (their #158/#159, found by the
# freeze drill here): a wedged webrtc driver costs a pool thread, not
# the embedding component.
wasmtime-webrtc-datachannels = { git = "https://github.com/polymorph-components/polymorph-webrtc-datachannels", rev = "f703a158b7a9736e9e2c85c2701d601221b60216" }
polymorph-webcrypto-wasmtime = { git = "https://github.com/polymorph-components/polymorph-webcrypto", rev = "662586ad873469c2329a0a73986adef8d5e3c908" }
wasmtime-websocket = { git = "https://github.com/polymorph-components/polymorph-websocket", rev = "9808bdb5d3f62d5212e2e91c9645d2f6cdda9e74" }

[[bin]]
name = "wosh-smoke-test"
path = "src/main.rs"
