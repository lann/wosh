[workspace]
resolver = "2"
members = [
    "connstring",
    "listener-host",
    "spikes/go-async-host",
]

# Built only for wasm32-wasip2 (they are `cdylib` components and do not
# link for the host target); `just compose` drives them:
#   listener-core, ssh-client-core
#
# `smoke-test` is the end-to-end gate for the browser client. It is
# written against the interface Component B must expose once finished
# (identity-openssh + publickey auth) and is deliberately left out of
# the default workspace until that lands -- see README "Where this
# actually is".
exclude = ["listener-core", "ssh-client-core", "smoke-test"]

[workspace.package]
edition = "2021"
publish = false

[profile.release]
opt-level = "s"
