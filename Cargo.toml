[workspace]
resolver = "2"

members = [
    "connstring",
    "hostkey",
    "sftp",
    "tunnel",
    "webauthn-ssh",
    "listener-core",
    "listener-host",
    "smoke-test",
    "spikes/go-async-host",
    "wosh-client",
]

# `listener-core` is a `cdylib` component: it builds only for
# wasm32-wasip2 and does not link for the host. Keeping it a MEMBER (so
# it shares the workspace target directory and `-p` works) while leaving
# it out of the defaults means a bare `cargo build` skips it and
# `just compose` builds it explicitly for the right target.
#
# Membership matters more than it looks: an excluded crate builds into
# its OWN target/ directory, so `wac plug` and any recipe referring to
# target/wasm32-wasip2/... silently reads a stale artifact or none at
# all -- which is exactly how this broke in CI.
default-members = [
    "connstring",
    "hostkey",
    "sftp",
    "tunnel",
    "webauthn-ssh",
    "webauthn-ssh",
    "listener-host",
    "smoke-test",
    "spikes/go-async-host",
]

[workspace.package]
edition = "2021"
publish = false

[profile.release]
opt-level = "s"
