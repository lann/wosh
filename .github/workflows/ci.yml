# CI: the project gates, and — on main — the Pages deploy gated on
# them. One job runs the same sequence a developer runs locally
# (scripts/setup.sh, then the just gates), so the pins in
# scripts/setup.sh flow here automatically; the deploy job only ships
# the tree the gates job already built and uploaded.
#
# Excluded from CI: m5-netem (sudo tc latency/loss matrix — a
# measurement, not a pass/fail gate, and timing-hostile on shared
# runners).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run of the same ref, but only
# PR runs are cancelled mid-flight — never yank a main run that may be
# about to deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # mosh requires a UTF-8 locale on both ends.
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: System packages (mosh — conformance + proxy-spawned servers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mosh

      # scripts/setup.sh expects the wasmtime CLI preinstalled (locally
      # the polymorph family setup provides it). Pinned to the same
      # major as the wasmtime crates the proxy and harnesses embed.
      - name: wasmtime CLI
        run: |
          v=47.0.1
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/v${v}/wasmtime-v${v}-x86_64-linux.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" "wasmtime-v${v}-x86_64-linux/wasmtime"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wasmtime" --version

      # The .deps clones must exist before rust-cache snapshots their
      # lockfiles; pins are READ FROM scripts/setup.sh, so a pin bump
      # there flows here automatically (setup.sh later re-checks them).
      - name: Check out pinned .deps (pins live in scripts/setup.sh)
        run: |
          deltic_pin=$(sed -n 's/^DELTIC_PIN=//p' scripts/setup.sh)
          piroh_pin=$(sed -n 's/^PIROH_PIN=//p' scripts/setup.sh)
          [ -n "$deltic_pin" ] && [ -n "$piroh_pin" ]
          git clone https://github.com/lann/deltic .deps/deltic
          git -C .deps/deltic checkout --quiet "$deltic_pin"
          git clone https://github.com/polymorph-components/polymorph-iroh .deps/polymorph-iroh
          git -C .deps/polymorph-iroh checkout --quiet "$piroh_pin"

      # Installs just/wac/wasm-tools (digest-pinned cargo-binstall,
      # prebuilt assets) and clones polymorph-iroh's own pinned .deps —
      # including upstream iroh, whose relay the e2e gates spawn. No
      # cargo builds happen here (rust-cache comes after).
      - name: polymorph-iroh setup
        working-directory: .deps/polymorph-iroh
        run: scripts/setup.sh

      - name: Rust wasm targets
        run: rustup target add wasm32-wasip2 wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client-core -> target
            proxy-core -> target
            proxy -> target
            spikes/compose/adapter -> target
            host-test/composed-e2e -> target
            host-test/proxy-e2e -> target
            host-test/passkey-e2e -> target
            host-test/ssh-e2e -> target
            .deps/deltic -> target
            .deps/polymorph-iroh -> target
            .deps/polymorph-iroh/.deps/iroh -> target

      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.5'
          cache-dependency-path: |
            engine-go/go.sum
            host-test/moshgo-server/go.sum

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Everything else, exactly as locally: componentize-go, the
      # deltic translator shim, iroh-endpoint + iroh-relay, npm and
      # deno module installs. Idempotent; tolerates the pre-seeded
      # tools and checkouts above.
      - name: wosh setup
        run: scripts/setup.sh

      # Browser legs (m2, m5, m6-browser, m7-browser) find the
      # runner's preinstalled Chrome via host-test/chrome.mjs.
      - name: Gates
        run: just spikes m1 m2 m3 m4 m5 m6 m6-browser m7 m7-browser

      # --- deploy tree, built by the same green run (main only) -----
      - name: Assemble the deploy tree
        if: github.ref == 'refs/heads/main'
        run: scripts/web-deploy-tree.sh "$GITHUB_WORKSPACE/_site"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  # The Pages push — gated on the gates job; deploys the artifact that
  # exact run produced.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
