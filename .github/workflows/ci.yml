# CI, tiered (issue: gates-as-CI was one 44-minute serial job).
#
# Measured on the serial job: actual gate RUNTIME is ~2 minutes; the
# other ~36 were four cold cargo builds of the wasmtime-embedding
# harnesses (m3 ~9m, m4 ~14m, m6 ~7m, m7 ~7m). So the layout below
# shards by WHAT GETS BUILT, not by test count, and treats caching as
# the first-order concern:
#
#   unit     — tier 0, PR-blocking: proto cargo tests + the web module
#              tests (connstring/storage/prf-wrap/panel state machines
#              in headless chromium). No wasm, no .deps. Minutes.
#   gates    — tier 1, PR-blocking: the native e2e gates, one shard
#              per cargo-build cluster (engine / proxy / sessions).
#   browser  — tier 2: the in-page e2e legs. Runs on main pushes, the
#              nightly drift watch, manual dispatch, and PRs that ask
#              for it with the `browser-gates` label (labeling
#              triggers a run — the `labeled` event type is wired).
#   deploy   — main pushes only, gated on ALL of the above; ships the
#              tree the same green run built.
#
# The e2e gates stay the source of truth (they keep finding the real
# bugs — see README findings); the tiers change their COST, not their
# authority. m5-netem stays excluded (sudo tc; a measurement, not a
# gate). Per-shard rust caches + cache-on-failure live in
# .github/actions/wosh-setup.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # Nightly drift watch: full matrix including the browser legs —
    # catches breakage from the unpinned edges (chromium, deno, go
    # toolchain drift) on quiet days.
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run of the same ref, but only
# PR runs are cancelled mid-flight — never yank a main run that may be
# about to deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # mosh requires a UTF-8 locale on both ends.
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  # --- tier 0: the standard fast layer ---------------------------------
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: unit
          cache-on-failure: true
          workspaces: proto -> target

      - name: proto unit tests (control/framing/escrow shapes, MOSH CONNECT parse)
        working-directory: proto
        run: cargo test

      # web-tests needs only the harness deps and the runner's
      # preinstalled chromium — no wasm artifacts, no .deps.
      - name: npm ci (host-test + web)
        run: |
          (cd host-test && npm ci --no-fund --no-audit)
          (cd web && npm ci --no-fund --no-audit)

      - name: web module tests (connstring, storage, prf-wrap, panel incl. ssh first-contact prompt)
        working-directory: host-test
        run: npm run web-tests

  # --- tier 1: native gates, sharded by cargo-build cluster -------------
  gates:
    name: gates (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # A flake in one shard must not mask another shard's real result.
      fail-fast: false
      matrix:
        include:
          # spikes + M1 conformance + M3 composed client: the Go/deno
          # lanes plus the one light harness (composed-e2e).
          - shard: engine
            recipes: spikes m1 m3
            workspaces: |
              spikes/compose/adapter -> target
              client-core -> target
              host-test/composed-e2e -> target
              .deps/deltic -> target
              .deps/polymorph-iroh -> target
              .deps/polymorph-iroh/.deps/iroh -> target
          # M4: the proxy stack — the single longest cold build, so it
          # gets a shard to itself.
          - shard: proxy
            recipes: m4
            workspaces: |
              client-core -> target
              proxy-core -> target
              proxy -> target
              host-test/proxy-e2e -> target
              .deps/deltic -> target
              .deps/polymorph-iroh -> target
              .deps/polymorph-iroh/.deps/iroh -> target
          # M6 passkeys + M7 inner ssh: the two session-layer harnesses.
          - shard: sessions
            recipes: m6 m7
            workspaces: |
              client-core -> target
              proxy-core -> target
              proxy -> target
              host-test/passkey-e2e -> target
              host-test/ssh-e2e -> target
              .deps/deltic -> target
              .deps/polymorph-iroh -> target
              .deps/polymorph-iroh/.deps/iroh -> target
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/wosh-setup
        with:
          shard: ${{ matrix.shard }}
          workspaces: ${{ matrix.workspaces }}

      - name: Gates
        run: just ${{ matrix.recipes }}

  # --- tier 2: the browser legs ------------------------------------------
  # m5-web is deliberately absent (the unit job runs it); this is the
  # composed-artifact-in-the-page set. Browser legs find the runner's
  # preinstalled Chrome via host-test/chrome.mjs.
  browser:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'browser-gates')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/wosh-setup
        with:
          shard: browser
          workspaces: |
            client-core -> target
            proxy-core -> target
            proxy -> target
            host-test/ssh-e2e -> target
            .deps/deltic -> target
            .deps/polymorph-iroh -> target
            .deps/polymorph-iroh/.deps/iroh -> target

      - name: Browser gates
        run: just m2 m5-client-deno m5-browser-e2e m6-browser m7-browser

      # --- deploy tree, built by the same green run (main pushes) -----
      - name: Assemble the deploy tree
        if: github.event_name == 'push'
        run: scripts/web-deploy-tree.sh "$GITHUB_WORKSPACE/_site"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: _site

  # The Pages push — main pushes only, gated on every tier; deploys the
  # artifact that exact run produced.
  deploy:
    if: github.event_name == 'push'
    needs: [unit, gates, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
