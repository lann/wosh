# Deploy the browser client to GitHub Pages on every merge to main.
#
# Builds the same static tree scripts/web-deploy-tree.sh assembles for
# any static host: the deltic page bundle, the composed client
# component, and the translator shim. This mirrors the client-relevant
# slice of scripts/setup.sh; the .deps pins are READ FROM that script,
# so a pin bump there flows here automatically.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out pinned .deps (pins live in scripts/setup.sh)
        run: |
          deltic_pin=$(sed -n 's/^DELTIC_PIN=//p' scripts/setup.sh)
          piroh_pin=$(sed -n 's/^PIROH_PIN=//p' scripts/setup.sh)
          [ -n "$deltic_pin" ] && [ -n "$piroh_pin" ]
          git clone https://github.com/lann/deltic .deps/deltic
          git -C .deps/deltic checkout --quiet "$deltic_pin"
          git clone https://github.com/polymorph-components/polymorph-iroh .deps/polymorph-iroh
          git -C .deps/polymorph-iroh checkout --quiet "$piroh_pin"

      # Clones polymorph-iroh's own pinned .deps and installs
      # just/wac/wasm-tools (command -v guarded) — the same tools the
      # local "polymorph family setup" provides.
      - name: polymorph-iroh setup
        working-directory: .deps/polymorph-iroh
        run: scripts/setup.sh

      - name: Rust wasm targets
        run: rustup target add wasm32-wasip2 wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client-core -> target
            .deps/deltic -> target
            .deps/polymorph-iroh -> target

      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.5'
          cache-dependency-path: engine-go/go.sum

      - name: componentize-go
        run: go install github.com/bytecodealliance/componentize-go@latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build the deltic translator shim
        working-directory: .deps/deltic
        run: cargo build -p translator-shim --target wasm32-unknown-unknown --release

      - name: Build the iroh-endpoint component
        working-directory: .deps/polymorph-iroh
        run: cargo build -p iroh-endpoint --target wasm32-wasip2 --release

      - name: deno install (root import map + npm deps)
        run: deno install --frozen --allow-scripts=npm:node-datachannel

      - name: npm ci (web/ — xterm assets)
        working-directory: web
        run: npm ci --no-fund --no-audit

      - name: Compose the client and bundle the page
        run: just compose-client web-bundle

      - name: Assemble the deploy tree
        run: scripts/web-deploy-tree.sh "$GITHUB_WORKSPACE/_site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
