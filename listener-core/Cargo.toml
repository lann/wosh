[package]
name = "wosh-listener-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "The wosh listener: a wasi:cli component that prints a QR/link, accepts iroh connections, and proxies each to a configured TCP endpoint."

[dependencies]
wosh-connstring = { path = "../connstring" }
wosh-tunnel = { path = "../tunnel" }
wit-bindgen = { version = "0.59", features = ["async", "async-spawn", "inter-task-wakeup"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false }

[lib]
crate-type = ["cdylib"]
