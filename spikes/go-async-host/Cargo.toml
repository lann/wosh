[package]
name = "irsh-spike-go-async-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Driver for the componentize-go async probes: sync-vs-async lifting, cross-call goroutine parking, and whether a keepalive task hosts background goroutine I/O."

[dependencies]
anyhow = "1"
futures = "0.3"
wasmtime = { version = "47", features = ["component-model", "component-model-async", "async", "cranelift", "runtime"] }
wasmtime-wasi = { version = "47", features = ["p3"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[bin]]
name = "irsh-spike-go-async-host"
path = "src/main.rs"
