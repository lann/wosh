<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>wosh</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./xterm/xterm.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    #status {
      font: 12px system-ui, sans-serif; color: #9a9a9a; background: #111;
      padding: 4px 8px; border-bottom: 1px solid #222;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    #panel {
      font: 12px system-ui, sans-serif; color: #bbb; background: #161616;
      padding: 6px 8px; border-bottom: 1px solid #222;
    }
    #panel button { font-size: 11px; }
    #panel input {
      background: #000; color: #ddd; border: 1px solid #333;
      font: 12px monospace; padding: 2px 4px;
    }
    #panel .boot-notice { color: #d90; margin-top: 4px; }
    #panel .boot-proxy, #panel .boot-pending, #panel .boot-entry, #panel .boot-session { margin-top: 4px; }
    #term { flex: 1; min-height: 0; padding: 2px; }
  </style>
  <script src="./xterm/xterm.js"></script>
  <script src="./xterm/addon-fit.js"></script>
</head>
<body>
  <div id="wrap">
    <div id="status">connecting…</div>
    <div id="panel"></div>
    <div id="term"></div>
  </div>
  <script type="module">
    import { connectIroh, connectSshIroh, persistCurrent, reattachIroh, setReconnectHandler } from "./app.mjs";
    import { initBoot } from "./boot.mjs";
    window.__moshBoot = await initBoot(document.getElementById("panel"), localStorage, {
      onConnect: connectIroh,
      onConnectSsh: connectSshIroh,
      onPersist: persistCurrent,
      onReattach: reattachIroh,
    });
    // Transport drop → one-gesture retry (issue #12): the tap/key that
    // triggers it is the WebAuthn user activation for reattach.
    setReconnectHandler(() => window.__moshBoot.reconnect());
    // PWA shell (issue #10): https only — dev/test serving (localhost
    // is a secure context but stays http) never installs the SW, so
    // caching can't confuse local iteration or the browser gates. The
    // deployed sw.js is version-keyed by web-deploy-tree.sh.
    if (location.protocol === "https:" && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("sw:", e));
    }
  </script>
</body>
</html>
