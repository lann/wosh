<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>experiment-mosh</title>
  <link rel="stylesheet" href="./xterm/xterm.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    #status {
      font: 12px system-ui, sans-serif; color: #9a9a9a; background: #111;
      padding: 4px 8px; border-bottom: 1px solid #222;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    #panel {
      font: 12px system-ui, sans-serif; color: #bbb; background: #161616;
      padding: 6px 8px; border-bottom: 1px solid #222;
    }
    #panel button { font-size: 11px; }
    #panel input {
      background: #000; color: #ddd; border: 1px solid #333;
      font: 12px monospace; padding: 2px 4px;
    }
    #panel .boot-notice { color: #d90; margin-top: 4px; }
    #panel .boot-proxy, #panel .boot-pending, #panel .boot-entry { margin-top: 4px; }
    #term { flex: 1; min-height: 0; padding: 2px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@bytecodealliance/preview2-shim/cli": "./shim/cli.js",
        "@bytecodealliance/preview2-shim/clocks": "./shim/clocks.js",
        "@bytecodealliance/preview2-shim/filesystem": "./shim/filesystem.js",
        "@bytecodealliance/preview2-shim/io": "./shim/io.js",
        "@bytecodealliance/preview2-shim/random": "./shim/random.js"
      }
    }
  </script>
  <script src="./xterm/xterm.js"></script>
  <script src="./xterm/addon-fit.js"></script>
</head>
<body>
  <div id="wrap">
    <div id="status">connecting…</div>
    <div id="panel"></div>
    <div id="term"></div>
  </div>
  <script type="module" src="./app.mjs"></script>
  <script type="module">
    import { initBoot } from "./boot.mjs";
    window.__moshBoot = await initBoot(document.getElementById("panel"));
  </script>
</body>
</html>
