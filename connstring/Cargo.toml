[package]
name = "wosh-connstring"
version = "0.1.0"
edition = "2021"
description = "The wosh pairing connection string: iroh pubkey + relay URL + optional token, as one base64url blob."
publish = false

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# One job: comparing a pairing token without leaking where it differs
# (see `token_eq`). Already in this workspace's tree at the same
# version, and no_std, so it costs the wasm components nothing.
subtle = { version = "2.6", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[lib]
name = "wosh_connstring"
path = "src/lib.rs"
