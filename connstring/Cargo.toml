[package]
name = "irsh-connstring"
version = "0.1.0"
edition = "2021"
description = "The irsh pairing connection string: iroh pubkey + relay URL + optional token, as one base64url blob."
publish = false

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[lib]
name = "irsh_connstring"
path = "src/lib.rs"
