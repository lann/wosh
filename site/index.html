<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- resizes-content: Android shrinks the layout viewport under the
       soft keyboard (fit() then runs off the resize); iOS ignores the
       token and mobile.mjs sizes off visualViewport instead. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#000000" />
  <!-- Deploy identity, substituted by scripts/site-deploy-tree.sh (the
       same version that keys the service worker's cache, so what the
       footer says is what the cache holds). The raw site/ tree keeps
       the placeholders; boot.mjs renders those as a dev build. -->
  <meta name="wosh-version" content="__WOSH_VERSION__" />
  <meta name="wosh-build" content="__WOSH_BUILD__" />
  <title>wosh</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./xterm/xterm.css" />
  <style>
    /* The chrome outside the terminal, mobile-first. One design rule
       generates most of the structure: every surface answers exactly
       one question. #home answers "which machine?"; the #sheet dialog
       hosts one ask at a time (host key, prompts, session actions);
       #identity and #prefs are the rare setup surfaces. The terminal
       itself (xterm under #term) is untouched. */
    :root {
      --bg: #000;
      --surface: #131313;
      --surface2: #1c1c1c;
      --line: #292929;
      --line2: #333;
      --text: #d6d6d6;
      --bright: #f2f2f2;
      --dim: #8a8a8a;
      --accent: #2d5e9e;
      --accent-line: #4a7ec0;
      --ok: #6fbf87;
      --warn: #d99a20;
      --danger: #f55;
      --fp: #fd5;
      --keyline: #8c8;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, sans-serif;
    }
    html, body { height: 100%; margin: 0; background: var(--bg); }
    body { font: 15px/1.45 var(--sans); color: var(--text); }

    /* ---- the session frame: header, terminal, extra keys ---- */
    #wrap { display: flex; flex-direction: column; height: 100%; }
    #bar {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px; background: #0d0d0d; border-bottom: 1px solid #222;
    }
    /* The chrome bars hold no text worth copying, and being selectable
       makes them a trap for the touch selection overlay
       (site/touch-select.mjs): dragging a selection handle off the top
       of the terminal extends the selection into #bar's own labels --
       the controls light up instead of the view scrolling. Unselectable,
       the platform clamps the drag to the nearest selectable position,
       which is the mirror's edge row, and that is precisely what feeds
       the overlay's edge ratchet. Scoped to these two bars on purpose:
       the sheets below carry fingerprints and key lines that people
       legitimately copy. */
    #bar, #keys { user-select: none; -webkit-user-select: none; }
    #dot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex: none; }
    #dot.ok { background: var(--ok); }
    #dot.warn { background: var(--warn); }
    #bar .sess-id { flex: 1; min-width: 0; }
    #who {
      display: block; font: 600 14px var(--mono); color: var(--bright);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #status {
      display: block; font: 12px var(--sans); color: var(--dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #sessions-btn {
      flex: none; min-width: 44px; min-height: 40px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--line2);
      color: var(--text); font-size: 17px;
    }
    /* Esc-intercept hint (site/esc-watch.mjs): a slim row, not a modal
       -- the user may be running the extension deliberately, so this
       is information, not an error to force past. [hidden] collapses
       the flex row cleanly; #term's own ResizeObserver refits the
       terminal when it does. */
    #escbanner {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; background: var(--surface);
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    }
    #escbanner[hidden] { display: none; }
    #escbanner .msg { flex: 1; min-width: 0; font: 13px var(--sans); color: var(--warn); }
    #escbanner button { flex: none; }
    #term { flex: 1; min-height: 0; padding: 2px; }
    /* Vertical drags in the terminal belong to mobile.mjs, which scrolls
       the scrollback with them -- xterm itself answers only to a mouse
       and a wheel, so without this the browser takes the gesture and
       pans the page. Pinch-zoom and horizontal panning stay the
       browser's; touch-action is inert for mouse input. */
    #term { touch-action: pan-x pinch-zoom; }
    /* extra-keys bar (mobile.mjs): coarse-pointer devices only -- soft
       keyboards have no Esc/Tab/Ctrl/arrows. Hidden ⇒ inert. Shown only
       WITH a live session (body.live, toggled by boot.mjs): on a
       sessionless page every key would be a no-op, which reads as
       breakage. */
    #keys { display: none; }
    @media (pointer: coarse) {
      body.live #keys {
        display: flex; align-items: stretch; flex: none; gap: 4px;
        padding: 4px 6px calc(4px + env(safe-area-inset-bottom));
        background: #111; border-top: 1px solid #222;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      #keys-strip {
        display: flex; gap: 4px; flex: 1; min-width: 0;
        overflow-x: auto; scrollbar-width: none;
      }
      #keys button {
        flex: none; min-width: 44px; height: 38px; touch-action: manipulation;
        font: 14px var(--sans); color: #ccc; background: var(--surface2);
        border: 1px solid var(--line2); border-radius: 6px; padding: 0 10px;
      }
      /* held, not yet fired: the key lands on release, so this is the
         only feedback during the press -- and it drops away when the
         finger drags off, showing that the key will NOT fire. */
      #keys button.pressed { background: #333; border-color: #666; }
      #keys button.armed { color: #fff; background: #2d5e9e; border-color: #4a7ec0; }
    }

    /* ---- session bookends (separator.mjs): unchanged ---- */
    .session-separator {
      display: flex; align-items: center; gap: 8px;
      font: 600 11px var(--sans); letter-spacing: 0.4px;
      white-space: nowrap; overflow: hidden;
    }
    .session-separator::before, .session-separator::after {
      content: ""; flex: 1; border-top: 2px solid currentColor;
      opacity: 0.4;
    }
    .session-separator.start { color: #6fbf87; }
    .session-separator.end { color: #c9847d; }

    /* ---- the chrome overlay: home / identity / prefs ---- */
    /* Opaque and full-viewport: with no session there is nothing under
       it worth seeing, and with one there is a "back to session" row. */
    #chrome {
      position: fixed; inset: 0; z-index: 20; overflow-y: auto;
      background: var(--bg);
    }
    #chrome[hidden] { display: none; }
    .screen { display: none; min-height: 100%; flex-direction: column; }
    .screen.on { display: flex; }
    .screen .pad { padding: 16px; }
    .wordmark { font: 600 13px var(--sans); letter-spacing: 2px; color: var(--dim); }
    .topline { display: flex; align-items: center; justify-content: space-between; }
    .applink {
      background: none; border: none; color: var(--dim);
      font: 13px var(--sans); padding: 8px; cursor: pointer;
    }
    .label {
      font: 600 12px var(--sans); letter-spacing: 1px; color: var(--dim);
      text-transform: uppercase; margin: 20px 0 8px;
    }
    .footer {
      margin-top: auto; display: flex; gap: 8px; justify-content: center;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    }
    .backrow {
      display: flex; align-items: center; gap: 8px; padding: 14px 16px 0;
    }
    .backrow .back {
      background: none; border: none; color: var(--dim);
      font-size: 22px; padding: 0 8px 0 0; cursor: pointer;
    }
    .backrow h1 { font: 600 17px var(--sans); color: var(--bright); margin: 0; }

    /* ---- buttons ---- */
    button { font: 16px var(--sans); color: var(--text); border-radius: 10px; cursor: pointer; }
    button.primary {
      background: var(--accent); border: 1px solid var(--accent-line); color: #fff;
      min-height: 48px; width: 100%; font-weight: 600;
    }
    button.secondary {
      background: var(--surface2); border: 1px solid var(--line2);
      min-height: 48px; width: 100%;
    }
    button.quiet { background: none; border: none; color: var(--dim); min-height: 44px; }
    /* the dangerous choice: quiet until armed, never the biggest target */
    button.danger { background: none; border: 1px solid #a33; color: var(--danger); min-height: 48px; width: 100%; }
    button.danger.armed { background: #802020; border-color: var(--danger); color: #fff; font-weight: 600; }
    button.small {
      min-height: 40px; padding: 0 14px; font-size: 14px;
      background: var(--surface2); border: 1px solid var(--line2); border-radius: 8px;
    }
    button.small.danger { background: none; width: auto; min-height: 40px; }

    /* ---- inputs ---- */
    input[type="text"], input[type="password"], select {
      width: 100%; min-height: 48px; padding: 0 12px; box-sizing: border-box;
      background: #0a0a0a; color: var(--bright); border: 1px solid var(--line2);
      border-radius: 10px; font: 16px var(--mono);
    }
    input::placeholder { color: #666; }
    input[type="checkbox"] {
      width: 22px; height: 22px; accent-color: var(--accent); margin: 0; flex: none;
    }
    /* a checkbox and its words are ONE tap target and wrap as one unit */
    label.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
    .fieldlabel { font: 13px var(--sans); color: var(--dim); margin: 12px 0 6px; }

    /* ---- home: connection cards ---- */
    .histrow {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px; margin-bottom: 10px; width: 100%; text-align: left;
      display: flex; align-items: center; gap: 12px; box-sizing: border-box;
    }
    .histrow .body { flex: 1; min-width: 0; }
    .histrow .title {
      display: block; font: 600 16px var(--mono); color: var(--bright);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .histrow .sub {
      font: 13px var(--sans); color: var(--dim); margin-top: 4px;
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    }
    .pill {
      font: 11px var(--sans); border: 1px solid var(--line2); border-radius: 99px;
      padding: 1px 8px; color: var(--dim); white-space: nowrap;
    }
    .pill.ok { color: var(--ok); border-color: #2e4a38; }
    .histrow .more {
      flex: none; width: 44px; height: 44px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface2); border: 1px solid var(--line2);
      color: var(--dim); font-size: 18px; line-height: 1;
    }
    /* the auto-resume countdown, ON the card it resumes */
    .histrow.resuming { border-color: #3a4a5e; }
    .resume-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .resume-row .t { font: 13px var(--sans); color: var(--dim); white-space: nowrap; }
    .resume-track { flex: 1; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
    .resume-fill { display: block; height: 100%; background: var(--accent-line); transition: width 1s linear; }
    .resume-row button { min-height: 36px; padding: 0 12px; font-size: 14px; background: var(--surface2); border: 1px solid var(--line2); border-radius: 8px; }

    /* the scan + paste pair */
    .scanrow button.scan { display: flex; align-items: center; justify-content: center; gap: 10px; }
    button.scan svg { width: 20px; height: 20px; }
    .pasterow { display: flex; gap: 8px; margin-top: 10px; }
    .pasterow input { flex: 1; min-width: 0; }
    .pasterow button {
      flex: none; width: 48px; min-height: 48px; font-size: 18px;
      background: var(--surface2); border: 1px solid var(--line2); border-radius: 10px;
    }
    .hero { margin: auto 0; text-align: center; padding: 0 16px; }
    .hero .pitch { color: var(--dim); font-size: 15px; margin-bottom: 24px; }
    .hero .inner { max-width: 340px; margin: 0 auto; }
    .hero .hint { color: #666; font-size: 13px; margin-top: 14px; }
    .notice { color: var(--warn); margin: 10px 0 0; font-size: 14px; }

    /* ---- the sheet: every ask, one at a time ---- */
    /* Every ask hangs from the TOP of the screen.
       Two reasons, both mobile: a sheet anchored to the bottom is the
       half of the screen the soft keyboard takes, so the moment an ask
       has a field in it -- the user name, an OTP, a session name --
       its own title and inputs are what gets crowded out; and the scan
       sheet has to be up here anyway, since that is the end of the
       phone the camera looks out of. One anchor for all of them beats
       a rule the scan sheet is always the exception to. */
    #sheet {
      width: 100%; max-width: 640px; box-sizing: border-box;
      margin: 0 auto auto;
      padding: calc(14px + env(safe-area-inset-top)) 16px 18px;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--line2); border-top: none;
      border-radius: 0 0 16px 16px;
      max-height: calc(100dvh - 40px); overflow-y: auto;
    }
    #sheet::backdrop { background: rgba(0, 0, 0, 0.72); }
    /* The session sheet is the one ask that is ABOUT the live session,
       and it is opened from the bar's own button -- so it hangs from
       under the bar rather than over it, leaving the real status strip
       (live dot, user@host, link state) visible instead of covering it
       and drawing a second, staler copy of the same thing. Every other
       sheet is a question that has nothing to do with the bar and
       keeps the full height, which short viewports need: at 340px the
       prompt sheet has no 53px to spare. --bar-h is measured in
       boot.mjs, because the bar's height follows its font. */
    #sheet[data-ask="session"] { margin-top: var(--bar-h, 0px); }
    #sheet .close-x {
      position: absolute; top: 8px; right: 8px;
      width: 40px; height: 40px; min-height: 40px;
      background: none; border: none; color: var(--dim);
      font-size: 20px; line-height: 1; padding: 0;
    }
    #sheet { position: relative; }
    #sheet h2 { font: 600 17px var(--sans); color: var(--bright); margin: 0 0 8px; }
    #sheet h2.warn { color: var(--danger); }
    #sheet p { margin: 0 0 12px; color: var(--dim); font-size: 14px; }
    #sheet .target { font: 13px var(--mono); color: var(--dim); margin-bottom: 8px; word-break: break-all; }
    #sheet .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    #sheet .notice { margin: 8px 0 0; }
    #sheet details { margin-top: 8px; }
    #sheet summary {
      color: var(--dim); cursor: pointer; user-select: none;
      min-height: 40px; display: flex; align-items: center; list-style: none; font-size: 15px;
    }
    #sheet summary::-webkit-details-marker { display: none; }
    #sheet summary::before { content: "▸"; display: inline-block; margin-right: 7px; font-size: 11px; }
    #sheet details[open] > summary::before { content: "▾"; }
    /* `hidden` must mean hidden even on elements whose display an
       author rule sets (.row's flex was silently overriding it, which
       is the standard [hidden] trap). */
    #sheet [hidden], #chrome [hidden] { display: none !important; }

    /* the fingerprint: the thing being confirmed. textContent stays the
       EXACT string (gates and humans compare it); the 4-char grouping is
       purely visual, margins on spans, so copying or reading the DOM
       yields the unbroken fingerprint. */
    #sheet .confirm code.fp {
      display: block; background: #0a0a0a; border: 1px solid var(--line);
      border-radius: 10px; padding: 12px; margin: 0 0 12px;
      font: 15px/1.9 var(--mono); color: var(--fp);
      word-break: break-all; user-select: all;
    }
    #sheet .confirm code.fp.old { color: #a89040; }
    #sheet .confirm code.fp .algo {
      display: block; color: var(--dim); font: 12px var(--sans);
      margin-bottom: 4px; user-select: none;
    }
    #sheet .confirm code.fp span.g {
      display: inline-block; /* wrap at group boundaries, never inside one */
      background: #1a1a1a; border-radius: 4px; padding: 1px 2px; margin-right: 5px;
    }

    /* session rows in the session sheet */
    .sessrow {
      display: flex; align-items: center; gap: 10px; min-height: 52px;
      border-bottom: 1px solid var(--line);
    }
    .sessrow:last-of-type { border-bottom: none; }
    .sessrow .name { font: 15px var(--mono); color: var(--bright); }
    .sessrow .meta { font: 12px var(--sans); color: var(--dim); }
    .sessrow .spacer { flex: 1; }
    .hedge { font: 12px var(--sans); color: #666; margin: 8px 0 0; }
    .newrow { display: flex; gap: 8px; margin-top: 10px; }
    .newrow input { flex: 1; min-height: 44px; }
    .newrow button { flex: none; }

    /* ---- identity & prefs cards ---- */
    .idcard {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px; margin: 12px 16px 0;
    }
    .idcard h3 { margin: 0 0 6px; font: 600 15px var(--sans); color: var(--bright); }
    .idcard p, .idcard .sub { margin: 0 0 10px; font: 13px var(--sans); color: var(--dim); }
    .idcard .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .keyblock, .idcard code {
      display: block; background: #0a0a0a; border: 1px solid var(--line);
      border-radius: 8px; padding: 10px; margin: 4px 0;
      font: 12px/1.6 var(--mono); color: var(--keyline);
      word-break: break-all; user-select: all;
    }
    .help-body { border-left: 2px solid var(--line2); padding-left: 8px; font-size: 13px; color: var(--dim); margin-top: 8px; }
    button.help {
      background: none; border: 1px solid #444; border-radius: 50%;
      color: var(--dim); width: 32px; height: 32px; min-height: 32px;
      padding: 0; line-height: 1; flex: none; font-size: 14px;
    }
    .pinrow { display: flex; align-items: center; gap: 10px; min-height: 48px; border-bottom: 1px solid var(--line); }
    .pinrow:last-of-type { border-bottom: none; }
    .pinrow .id { font: 13px var(--mono); color: var(--bright); word-break: break-all; }
    .pinrow .at { font: 12px var(--sans); color: var(--dim); }
    .pinrow .spacer { flex: 1; }
    .prefrow { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .prefrow:last-of-type { border-bottom: none; }
    .prefrow input { margin-top: 2px; }
    .prefrow .body { flex: 1; }
    .prefrow .t { font: 15px var(--sans); color: var(--bright); }
    .prefrow .d { font: 13px var(--sans); color: var(--dim); margin-top: 2px; }
    /* Deploy identity at the foot of #home and #prefs: quiet, selectable
       (it exists to be pasted into bug reports). */
    .buildinfo {
      margin-top: auto; text-align: center; user-select: all;
      font: 11px var(--mono); color: #555;
      padding: 24px 16px calc(16px + env(safe-area-inset-bottom));
    }

    /* The camera preview, while a scan is running (qr.mjs): a square,
       cropped (the decoder gets the full frame; only the VIEW clips),
       so the sheet stays compact and the framing reads as a viewfinder. */
    .scan-view video {
      display: block; width: 100%; aspect-ratio: 1 / 1;
      background: #000; border: 1px solid var(--line2); border-radius: 10px;
      object-fit: cover;
    }
    .scan-view .hint { color: var(--dim); margin: 8px 0; font-size: 13px; }
    .scan-view button { min-height: 44px; padding: 0 16px; background: var(--surface2); border: 1px solid var(--line2); border-radius: 8px; }

    /* ---- the link confirmation (links.mjs): unchanged semantics ---- */
    #linkdialog {
      font: 14px var(--sans); color: var(--text); background: var(--surface);
      border: 1px solid var(--line2); border-radius: 12px;
      padding: 14px 16px; margin: auto;
      width: min(480px, 92vw); box-sizing: border-box;
    }
    #linkdialog::backdrop { background: rgba(0, 0, 0, 0.65); }
    #linkdialog code {
      display: block; margin: 8px 0; padding: 8px;
      background: #000; color: #9ecbff;
      font: 13px var(--mono); word-break: break-all;
    }
    #linkdialog .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    #linkdialog .row .spacer { flex: 1; }
    #linkdialog label { display: flex; align-items: center; gap: 6px; }
    #linkdialog button { font-size: 14px; min-height: 40px; padding: 0 14px; background: var(--surface2); border: 1px solid var(--line2); border-radius: 8px; }

    /* ---- the transfer panel (transfer-ui.mjs): mobile-first, one
       column, no framework -- see that module's file comment for the
       full design. Reuses --bar-h the same way #sheet does, since it
       is another full-height ask over the terminal. */
    #transfers-btn {
      flex: none; min-width: 44px; min-height: 40px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--line2);
      color: var(--text); font-size: 17px;
    }
    #transfers-sheet {
      position: fixed; inset: 0; margin: 0; padding: 0; border: none;
      width: 100%; height: 100%; max-width: none; max-height: none;
      background: var(--bg); color: var(--text);
    }
    /* `[open]`-scoped, NOT on the bare selector: a `<dialog>` without
       `[open]` is UA-default `display: none`, and an unconditional
       `display: flex` here would override that default and leave the
       (invisible-looking, since nothing paints without [open]'s own
       layout box in some engines -- but NOT reliably nothing-clicking)
       sheet sitting over the whole viewport, eating every click on the
       page underneath it, including its own trigger button. Observed
       live: `just browser-transfer` timing out clicking `#transfers-btn`
       because `#transfers-sheet` (closed) intercepted the pointer event.
       The fix for "sticky must work inside its scroll container": this
       flex context is what makes `.panes{flex:1}` below actually work --
       `.tx-head` is a non-scrolling flex sibling that never moves, and
       `.panes` is the only element that scrolls -- the same visible
       result as position:sticky, without the scroll-jank a sticky
       header can show on some mobile browsers. */
    #transfers-sheet[open] {
      display: flex; flex-direction: column;
    }
    #transfers-sheet::backdrop { background: rgba(0, 0, 0, 0.72); }
    #transfers-sheet .tx-head {
      flex: none; position: relative; /* anchors .tx-dropdown below it */
      z-index: 2; background: var(--bg);
    }
    #transfers-sheet .txbar {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      background: #0d0d0d; border-bottom: 1px solid var(--line);
    }
    #transfers-sheet .txbar h1 { font: 600 16px var(--sans); color: var(--bright); margin: 0; flex: 1; min-width: 0; }
    #transfers-sheet .txbar button { min-height: 40px; padding: 0 12px; background: var(--surface2); border: 1px solid var(--line2); border-radius: 8px; color: var(--text); }
    #transfers-sheet .txbar button:disabled { opacity: 0.45; }
    #transfers-sheet .crumbs {
      display: flex; align-items: center; gap: 4px; padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }
    #transfers-sheet .crumb-list {
      display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0;
      overflow-x: auto; white-space: nowrap; font: 13px var(--mono); color: var(--dim);
    }
    /* The refresh button (dispatch #1) is a flex:none sibling of
       `.crumb-list`, not part of the scrolling breadcrumb chain, so a
       deep path never scrolls it out of reach. */
    #transfers-sheet .refresh-btn {
      flex: none; background: none; border: none; color: var(--dim);
      font-size: 16px; min-width: 32px; min-height: 32px; cursor: pointer;
    }
    #transfers-sheet .refresh-btn:active { color: var(--bright); }
    /* Crumbs read as navigation, not decoration (dispatch #3): the
       site's other tappable text uses --accent-line for the "this
       does something" color (button.primary's border, the resume
       bar's fill) -- underlined here too, since a crumb has no
       button-shaped background to lean on. The current-directory
       crumb is a `<span>`, not a `<button>` (transfer-ui.mjs), so it
       is non-interactive in fact, not just in color: plain text,
       `--bright`, no underline, default cursor. */
    #transfers-sheet .crumbs button.crumb {
      background: none; border: none; padding: 4px 2px; min-height: 32px;
      font: 13px var(--mono); color: var(--accent-line); text-decoration: underline;
      text-underline-offset: 2px; cursor: pointer;
    }
    #transfers-sheet .crumbs button.crumb:active { color: var(--bright); background: var(--surface2); border-radius: 4px; }
    #transfers-sheet .crumbs span.crumb.here { color: var(--bright); font: 13px var(--mono); padding: 4px 2px; cursor: default; }
    /* The transfers dropdown: anchored to `.tx-head` (position:
       relative above), `top:100%` drops it exactly below the header
       block's own height -- no measurement of --bar-h-style custom
       properties needed. It sits ABOVE `.panes` (z-index) so opening
       it never reflows or obstructs the listing underneath; closing
       it (the default, `[hidden]`) leaves the listing exactly as it
       was. Works identically at phone widths since it is 100% of the
       sheet's own width, not a fixed-size anchored popover. */
    #transfers-sheet .tx-dropdown {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 3;
      max-height: 60vh; overflow-y: auto;
      background: var(--surface); border-bottom: 1px solid var(--line2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    #transfers-sheet .panes { flex: 1; overflow: hidden auto; display: flex; flex-direction: column; }
    /* Locked while the dropdown is open (dispatch #2): the dropdown
       floats OVER the listing rather than replacing it, and letting
       the listing keep scrolling underneath read as broken. */
    #transfers-sheet .panes.locked { overflow: hidden; touch-action: none; }
    #transfers-sheet .entry-row, #transfers-sheet .transfer-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-bottom: 1px solid var(--line); min-height: 44px;
    }
    #transfers-sheet .entry-row button.namebtn {
      flex: 1; min-width: 0; text-align: left; background: none; border: none;
      color: var(--text); font: 14px var(--sans); padding: 4px 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #transfers-sheet .entry-row .icon { flex: none; width: 18px; text-align: center; color: var(--dim); }
    #transfers-sheet .entry-row .meta { flex: none; font: 12px var(--mono); color: var(--dim); }
    #transfers-sheet .transfer-row { flex-direction: column; align-items: stretch; gap: 4px; }
    #transfers-sheet .transfer-row .t { display: flex; gap: 8px; align-items: center; font: 13px var(--sans); }
    #transfers-sheet .transfer-row .t .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--bright); }
    #transfers-sheet .transfer-row .t .bytes { flex: none; color: var(--dim); font: 12px var(--mono); }
    #transfers-sheet .transfer-row .bar { height: 4px; border-radius: 2px; background: var(--surface2); overflow: hidden; }
    #transfers-sheet .transfer-row .fill { display: block; height: 100%; background: var(--accent-line); transition: width 0.2s linear; }
    #transfers-sheet .transfer-row.err .fill { background: var(--danger); }
    #transfers-sheet .transfer-row .err-msg { color: var(--danger); font: 12px var(--sans); }
    #transfers-sheet .transfer-row .actions { display: flex; gap: 8px; }
    #transfers-sheet .transfer-row .actions button { font-size: 12px; min-height: 32px; padding: 0 10px; background: var(--surface2); border: 1px solid var(--line2); border-radius: 6px; color: var(--text); }
    #transfers-sheet .upload-drop {
      margin: 10px 12px; padding: 16px; border: 2px dashed var(--line2); border-radius: 10px;
      text-align: center; color: var(--dim); font: 13px var(--sans);
    }
    #transfers-sheet .upload-drop.over { border-color: var(--accent-line); color: var(--bright); }
    /* The one upload affordance (dispatch #1): a link-styled button
       inline in the drop-zone sentence, not a second button elsewhere
       offering the same action. */
    #transfers-sheet .upload-drop .link-btn {
      background: none; border: none; padding: 0; margin: 0;
      color: var(--accent-line); text-decoration: underline; text-underline-offset: 2px;
      font: 13px var(--sans); cursor: pointer;
    }
    #transfers-sheet .upload-drop .link-btn:active { color: var(--bright); }
    #transfers-sheet .empty { padding: 16px 12px; color: var(--dim); font: 13px var(--sans); }
    #transfers-sheet .section-label { padding: 10px 12px 4px; font: 600 11px var(--sans); letter-spacing: 0.4px; color: var(--dim); text-transform: uppercase; }
  </style>
  <script src="./xterm/xterm.js"></script>
  <script src="./xterm/addon-fit.js"></script>
  <script src="./xterm/addon-unicode11.js"></script>
  <script src="./xterm/addon-clipboard.js"></script>
  <script src="./xterm/addon-web-links.js"></script>
  <script src="./xterm/addon-image.js"></script>
  <script src="./xterm/addon-webgl.js"></script>
  <script src="./xterm/addon-serialize.js"></script>
</head>
<body>
  <div id="wrap">
    <div id="bar">
      <span id="dot"></span>
      <span class="sess-id">
        <span id="who"></span>
        <span id="status">idle</span>
      </span>
      <button id="sessions-btn" title="sessions">⇆</button>
      <button id="transfers-btn" title="files" hidden>⇅</button>
    </div>
    <div id="escbanner" hidden>
      <span class="msg">⚠ detected a pattern of events consistent with a browser extension (such as Vimium) capturing the esc key — you might need to exclude this site in the extension's settings.</span>
      <button class="dismiss small">dismiss</button>
      <button class="never small">don't show again</button>
    </div>
    <div id="term"></div>
    <div id="keys"></div>
  </div>
  <!-- The chrome overlay: home (connections), identity & keys, settings.
       boot.mjs owns everything inside. Shown whenever there is no
       session to look at; reachable in-session via the session sheet. -->
  <div id="chrome">
    <section id="home" class="screen on"></section>
    <section id="connection" class="screen"></section>
    <section id="prefs" class="screen"></section>
  </div>
  <!-- Every ask rides this one dialog, one at a time: host-key
       confirmation, prompt batches, the passkey ceremony, the connect
       form, the session sheet, card menus. boot.mjs owns it. -->
  <dialog id="sheet"></dialog>
  <dialog id="linkdialog"></dialog>
  <dialog id="transfers-sheet"></dialog>
  <script type="module">
    import { activeSession, connect } from "./app.mjs";
    import { initBoot } from "./boot.mjs";
    import { initTransfers } from "./transfer-ui.mjs";
    window.__woshBoot = await initBoot(document.getElementById("chrome"), { onConnect: connect });
    window.__woshTransfers = initTransfers({ getSession: activeSession });
    // PWA shell: https only. Local serving stays http, so development
    // and the browser gate never install the worker and a stale cache
    // can never confuse them. The deployed sw.js is version-keyed by
    // scripts/site-deploy-tree.sh.
    if (location.protocol === "https:" && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("sw:", e));
    }
  </script>
</body>
</html>
