<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- resizes-content: Android shrinks the layout viewport under the
       soft keyboard (fit() then runs off the resize); iOS ignores the
       token and mobile.mjs sizes off visualViewport instead. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#000000" />
  <title>wosh</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./xterm/xterm.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    /* The one always-visible strip: status + session controls. The
       connect form lives in the #panel dialog so a live session gets
       the whole viewport. */
    #bar {
      display: flex; align-items: center; gap: 8px;
      font: 12px system-ui, sans-serif; color: #9a9a9a; background: #111;
      padding: 4px 8px; border-bottom: 1px solid #222;
    }
    #status {
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #bar button {
      flex: none; font: 11px system-ui, sans-serif;
      color: #ccc; background: #1c1c1c; border: 1px solid #333;
      border-radius: 4px; padding: 2px 8px;
    }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    #panel {
      font: 12px system-ui, sans-serif; color: #bbb; background: #161616;
      border: 1px solid #333; border-radius: 8px;
      padding: 10px 12px; margin: auto;
      width: min(560px, 92vw); box-sizing: border-box;
    }
    #panel::backdrop { background: rgba(0, 0, 0, 0.65); }
    /* The link confirmation (links.mjs): same family as #panel, sized
       for one URL and two buttons. The URL gets the full width and
       breaks anywhere -- it is the thing being confirmed, so it must
       be readable in full, not ellipsized. */
    #linkdialog {
      font: 12px system-ui, sans-serif; color: #bbb; background: #161616;
      border: 1px solid #333; border-radius: 8px;
      padding: 12px 14px; margin: auto;
      width: min(480px, 92vw); box-sizing: border-box;
    }
    #linkdialog::backdrop { background: rgba(0, 0, 0, 0.65); }
    #linkdialog code {
      display: block; margin: 8px 0; padding: 6px;
      background: #000; color: #9ecbff;
      font: 12px monospace; word-break: break-all;
    }
    #linkdialog .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    #linkdialog .row .spacer { flex: 1; }
    #linkdialog label { display: flex; align-items: center; gap: 4px; }
    #linkdialog button { font-size: 13px; min-height: 30px; }
    #panel .title {
      display: flex; align-items: center; margin-bottom: 6px;
      color: #ddd; font-weight: 600;
    }
    #panel .title span { flex: 1; }
    #panel button { font-size: 11px; }
    #panel input, #panel select {
      background: #000; color: #ddd; border: 1px solid #333;
      font: 12px monospace; padding: 3px 4px;
    }
    #panel .connstring { width: 100%; box-sizing: border-box; }
    /* the field and its scan button share one line */
    #panel .csrow { display: flex; gap: 6px; align-items: stretch; }
    #panel .csrow .connstring { flex: 1; min-width: 0; }
    #panel .csrow .scan { flex: none; }
    /* the camera preview, while a scan is running */
    #panel .scan-view { margin-top: 8px; }
    #panel .scan-view video {
      display: block; width: 100%; max-height: 46vh;
      background: #000; border: 1px solid #333; border-radius: 4px;
      object-fit: contain;
    }
    #panel .scan-view .hint { color: #888; margin: 4px 0; }
    #panel .field { color: #888; margin-top: 8px; margin-bottom: 2px; }
    /* The collapsed sections (auth override, keys & identity): the
       summary is a one-line control styled like a .field label, with
       enough padding to be a comfortable tap target. */
    #panel details { margin-top: 8px; }
    #panel summary { color: #888; cursor: pointer; user-select: none; padding: 4px 0; }
    #panel summary:hover { color: #bbb; }
    #panel .row { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #panel .notice { color: #d90; margin-top: 8px; }
    /* connection history: tap a row to reconnect (tokenless; pairing
       enrollment stands in for the QR's token) */
    #panel .history { margin-bottom: 4px; }
    #panel .histhead { display: flex; align-items: center; }
    #panel .histhead span { flex: 1; }
    #panel .histline { display: flex; gap: 4px; align-items: stretch; margin-top: 4px; }
    #panel .histrow {
      flex: 1; text-align: left; font: 12px monospace;
      color: #ddd; background: #1c1c1c; border: 1px solid #333;
      border-radius: 4px; padding: 4px 8px; cursor: pointer;
    }
    #panel .histrow:hover { background: #242424; }
    #panel .histrow .sub { color: #8a8a8a; font-size: 11px; margin-top: 1px; }
    #panel button.subtle {
      color: #888; background: transparent; border: 1px solid #2a2a2a;
      border-radius: 4px;
    }
    /* an armed (click-again-to-confirm) destructive button */
    #panel button.subtle.armed { color: #f55; border-color: #f55; }
    #panel .confirm { color: #d90; margin-top: 8px; }
    #panel .confirm code, #panel .key code { color: #fd5; }
    /* a changed pinned host key: the one alarming state on this page */
    #panel .confirm .warn { color: #f55; font-weight: bold; }
    #panel .key {
      margin-top: 8px; font: 11px monospace; color: #8c8;
      word-break: break-all;
    }
    #panel .key code { user-select: all; }
    /* the passkey section: same visual register as .key (a public
       authorized_keys line), plus its own enrol/adopt/forget controls */
    #panel .passkey { margin-top: 8px; }
    #panel .passkey code {
      display: block; font: 11px monospace; color: #8c8;
      word-break: break-all; user-select: all; margin: 4px 0;
    }
    #panel .passkey .row { margin-top: 6px; }
    #panel .passkey input {
      width: 100%; box-sizing: border-box;
    }
    #term { flex: 1; min-height: 0; padding: 2px; }
    /* Vertical drags in the terminal belong to mobile.mjs, which scrolls
       the scrollback with them -- xterm itself answers only to a mouse
       and a wheel, so without this the browser takes the gesture and
       pans the page. Pinch-zoom and horizontal panning stay the
       browser's; touch-action is inert for mouse input. */
    #term { touch-action: pan-x pinch-zoom; }
    /* extra-keys bar (mobile.mjs): coarse-pointer devices only — soft
       keyboards have no Esc/Tab/Ctrl/arrows. Hidden ⇒ inert. */
    #keys { display: none; }
    @media (pointer: coarse) {
      #keys {
        display: flex; align-items: stretch; flex: none; gap: 4px;
        padding: 4px 6px calc(4px + env(safe-area-inset-bottom));
        background: #111; border-top: 1px solid #222;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      #keys-strip {
        display: flex; gap: 4px; flex: 1; min-width: 0;
        overflow-x: auto; scrollbar-width: none;
      }
      #keys button {
        flex: none; min-width: 44px; height: 38px; touch-action: manipulation;
        font: 14px system-ui, sans-serif; color: #ccc; background: #1c1c1c;
        border: 1px solid #333; border-radius: 6px; padding: 0 10px;
      }
      /* held, not yet fired: the key lands on release, so this is the
         only feedback during the press — and it drops away when the
         finger drags off, showing that the key will NOT fire. */
      #keys button.pressed { background: #333; border-color: #666; }
      #keys button.armed { color: #fff; background: #2d5e9e; border-color: #4a7ec0; }
      /* 16px stops the iOS focus auto-zoom on the connect panel */
      #panel input, #panel select { font-size: 16px; }
      /* The two folded summaries are primary tap targets here: give
         them the same comfortable height the buttons get. */
      #panel summary { min-height: 32px; display: flex; align-items: center; font-size: 14px; }
      #panel button { font-size: 14px; min-height: 32px; }
      #bar button { font-size: 13px; min-height: 28px; }
    }
  </style>
  <script src="./xterm/xterm.js"></script>
  <script src="./xterm/addon-fit.js"></script>
  <script src="./xterm/addon-unicode11.js"></script>
  <script src="./xterm/addon-clipboard.js"></script>
  <script src="./xterm/addon-web-links.js"></script>
  <script src="./xterm/addon-image.js"></script>
  <script src="./xterm/addon-webgl.js"></script>
</head>
<body>
  <div id="wrap">
    <div id="bar">
      <span id="status">idle</span>
      <button id="detach-btn" hidden>detach</button>
      <button id="settings-btn">connect…</button>
    </div>
    <div id="term"></div>
    <div id="keys"></div>
  </div>
  <dialog id="panel"></dialog>
  <dialog id="linkdialog"></dialog>
  <script type="module">
    import { connect } from "./app.mjs";
    import { initBoot } from "./boot.mjs";
    window.__woshBoot = await initBoot(document.getElementById("panel"), { onConnect: connect });
    // PWA shell: https only. Local serving stays http, so development
    // and the browser gate never install the worker and a stale cache
    // can never confuse them. The deployed sw.js is version-keyed by
    // scripts/site-deploy-tree.sh.
    if (location.protocol === "https:" && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("sw:", e));
    }
  </script>
</body>
</html>
