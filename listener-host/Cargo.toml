[package]
name = "irsh-listener-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "The native host shell for irsh-listener-core: wasmtime + the polymorph-iroh native host crates (webcrypto/websocket/webrtc), running the wac-composed listener component."

[dependencies]
anyhow = "1"
wasmtime = { version = "47", features = ["component-model", "component-model-async", "async", "cranelift", "runtime"] }
wasmtime-wasi = { version = "47", features = ["p3"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

# The polymorph-iroh endpoint component (fused into the composed
# listener by `wac plug`) imports these three non-WASI interfaces
# regardless of which paths (relay/direct/webrtc) are actually in use;
# these crates are their native-host implementations. Pinned to the
# same revisions polymorph-iroh's own scripts/setup.sh pins (see this
# project's scripts/setup.sh).
wasmtime-webrtc-datachannels = { git = "https://github.com/polymorph-components/polymorph-webrtc-datachannels", rev = "aa9460c674e9f9a5d3227291333a60ecd5bcd988" }
polymorph-webcrypto-wasmtime = { git = "https://github.com/polymorph-components/polymorph-webcrypto", rev = "662586ad873469c2329a0a73986adef8d5e3c908" }
wasmtime-websocket = { git = "https://github.com/polymorph-components/polymorph-websocket", rev = "9808bdb5d3f62d5212e2e91c9645d2f6cdda9e74" }

[[bin]]
name = "irsh-listener"
path = "src/main.rs"
