[package]
name = "wosh-listener-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "The native host shell for wosh-listener-core: wasmtime + the polymorph-iroh native host crates (webcrypto/websocket/webrtc), running the wac-composed listener component."

[dependencies]
anyhow = "1"
wasmtime = { version = "47", features = ["component-model", "component-model-async", "async", "cranelift", "runtime"] }
wasmtime-wasi = { version = "47", features = ["p3"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# Advisory lock on the identity dir: exactly one listener per identity
# (twins silently fight over the relay registration; see README).
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

# The polymorph-iroh endpoint component (fused into the composed
# listener by `wac plug`) imports these three non-WASI interfaces
# regardless of which paths (relay/direct/webrtc) are actually in use;
# these crates are their native-host implementations. Pinned to the
# siblings' release tags. polymorph-iroh's own Cargo.toml pins these
# crates by rev (what the endpoint guest builds against). At v0.6.0:
# websocket and datachannels are WIT- and Rust-identical to the pinned
# revs (only Cargo.toml/lock version churn); webcrypto's WIT is
# identical but its Rust adds a host API (`from_material`, their #395)
# and tightens one check -- importing a signing key with a policy
# granting no usage now fails `not-permitted`. wosh's import sites
# (wosh-client/src/pairing.rs, listener-core/src/identity.rs) both set
# can_sign(true), so unaffected. datachannels is held at v0.6.0 (not
# v0.6.2): its v0.6.1+ host crate moved to wasmtime 48 while
# webcrypto/websocket are still on 47, and a native host cannot link
# two wasmtime versions. Re-verify all of this when bumping (see this
# project's scripts/setup.sh).
# Carries driver reactor isolation (their #158/#159, found by the
# freeze drill here): a wedged webrtc driver costs a pool thread, not
# the embedding component.
wasmtime-webrtc-datachannels = { git = "https://github.com/polymorph-components/polymorph-webrtc-datachannels", tag = "v0.6.0" }
polymorph-webcrypto-wasmtime = { git = "https://github.com/polymorph-components/polymorph-webcrypto", tag = "v0.6.0" }
wasmtime-websocket = { git = "https://github.com/polymorph-components/polymorph-websocket", tag = "v0.6.0" }

[[bin]]
name = "wosh-listener"
path = "src/main.rs"
